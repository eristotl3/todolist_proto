  <ellipse cx="58" cy="84" rx="7" ry="3" fill="#cf6a3a"/>
  <!-- penguin body -->
  <path d="M24 44 Q24 18 48 18 Q72 18 72 44 L72 70 Q72 82 48 82 Q24 82 24 70 Z" fill="#1c1815"/>
