  <rect x="38" y="42" width="5" height="5" rx="1.2" fill="#cf6a3a"/>
  <path d="M39 44.5 L40.2 45.7 L42 43.8" stroke="#fef8ec" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="46" y="43" width="14" height="3" rx="1.5" fill="#1c1815" opacity="0.7"/>
  <!-- checklist row 2 (checked) -->
  <rect x="38" y="51" width="5" height="5" rx="1.2" fill="#cf6a3a"/>
  <path d="M39 53.5 L40.2 54.7 L42 52.8" stroke="#fef8ec" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="46" y="52" width="11" height="3" rx="1.5" fill="#1c1815" opacity="0.7"/>
  <!-- checklist row 3 (unchecked) -->
  <rect x="38" y="60" width="5" height="5" rx="1.2" fill="none" stroke="#cf6a3a" stroke-width="1.2"/>
  <rect x="46" y="61" width="16" height="3" rx="1.5" fill="#1c1815" opacity="0.4"/>
  <!-- eyes -->
  <circle cx="42" cy="34" r="2" fill="#fef8ec"/>
  <circle cx="54" cy="34" r="2" fill="#fef8ec"/>
  <circle cx="42" cy="34" r="1" fill="#1c1815"/>
  <circle cx="54" cy="34" r="1" fill="#1c1815"/>
