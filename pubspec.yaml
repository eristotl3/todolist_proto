name: todolist_proto
description: "Teacher-student todo list app with real-time completion tracking."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.8.4

  # Navigation
  go_router: ^14.8.1

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Data models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # UI utilities
  intl: ^0.20.2
  flutter_slidable: ^3.1.1
  shimmer: ^3.0.0
  gap: ^3.0.1

  # Desktop
  window_manager: ^0.4.3

  # Utilities
  uuid: ^4.5.1
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/config.env
    - shorebird.yaml
